# Repo gate for mixpanel-headless-ts.
#
# `npm run check` (package.json) is the source of truth for what the gate runs;
# this workflow only adds what cannot live in an npm script: a Node matrix, the
# lockfile-freshness check, and the conformance-report artifact. The intended
# end state of `check` is listed in docs/history/cleanup-plan-2026-09.md §14.
#
# Supply-chain rules for this file: SHA-pin every action (Dependabot bumps the
# SHA and the trailing `# vX.Y.Z` comment together), least-privilege token,
# and no secrets — the gate never talks to Mixpanel.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pushes to a PR cancel the running gate; pushes to main all run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Quiet npm in CI: no funding banner, no audit report.
  npm_config_fund: "false"
  npm_config_audit: "false"

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both supported release lines. `engines` is `^22.22.2 || >=24.15` with
        # `engine-strict=true` (.npmrc); setup-node resolves `22` to the latest
        # 22.x (22.23.2 at the time of writing), which satisfies the lower
        # bound. `.node-version` (22) is the local default and is not read here.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (lockfile-exact)
        id: install
        run: npm ci

      # A clean `npm ci` must not rewrite the lockfile; if it does, the
      # committed package-lock.json is stale or was hand-edited.
      - name: Lockfile freshness
        run: git diff --exit-code package-lock.json

      # The gate: build + typecheck (tsc -b), lint, format, the full vitest run
      # (which already replays the whole conformance corpus via
      # conformance-runner/test/corpus.test.ts), browser-purity smoke, and
      # whatever else package.json `check` grows (docs/history/cleanup-plan-2026-09.md §14).
      - name: Gate
        run: npm run check

      # The corpus already ran inside `npm run check`; this second run exists
      # only to produce the machine-readable D12 report as an artifact. The
      # CLI writes the JSON to stdout (summary to stderr), so it is redirected
      # here. Runs even when the gate failed so the report is available for
      # triage, but not when install failed or the job was cancelled.
      - name: Conformance report
        id: report
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          mkdir -p conformance-runner/dist
          npm run --silent conformance -- --report json > conformance-runner/dist/report.json

      - name: Upload conformance report
        if: ${{ !cancelled() && steps.report.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-report-node${{ matrix.node }}
          path: conformance-runner/dist/report.json
          if-no-files-found: error
          retention-days: 14
