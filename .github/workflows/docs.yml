# Documentation site for mixpanel-headless-ts (CONTRIBUTING.md,
# "Documentation").
#
# `npm run docs:build` (package.json) is the source of truth for what a docs
# build is: `tsc -b`, TypeDoc into docs/reference/, then VitePress, which
# compiles every ```ts twoslash block against the built declarations and fails
# on a dead link or a type error. This workflow only adds what an npm script
# cannot: the Pages artifact and deployment, and a reviewable artifact on pull
# requests.
#
# Supply-chain rules for this file: SHA-pin every action (Dependabot bumps the
# SHA and the trailing `# vX.Y.Z` comment together), least-privilege token per
# job, and no secrets — the build never talks to Mixpanel.
#
# Deployment needs GitHub Pages enabled on the repository (Settings → Pages →
# Source "GitHub Actions"); on a private repository that requires a paid plan.
# Until it is enabled the `build` job still runs on every push and PR and the
# site is downloadable as an artifact (the Pages upload is a plain artifact
# upload and succeeds), while `deploy` fails at actions/deploy-pages. There
# is no configure-pages step: the base path is derived from the repository
# name below, and that action would need `pages` permission and an enabled
# site just to read metadata nothing here uses.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # One run per ref at a time: a newer push queues behind the running one
  # rather than cancelling it, so a deployment in flight always completes.
  cancel-in-progress: false

env:
  npm_config_fund: "false"
  npm_config_audit: "false"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: VitePress reads each page's last commit date for
          # its "Last updated" footer.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install (lockfile-exact)
        run: npm ci

      # The project page lives under `/<repo>/`; a custom domain later means
      # dropping these two variables, not editing the config.
      - name: Resolve site base
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "DOCS_BASE=/${REPOSITORY#*/}/" >> "$GITHUB_ENV"
          echo "DOCS_ORIGIN=https://${REPOSITORY%%/*}.github.io" >> "$GITHUB_ENV"

      # Runs in Node's default heap: measured at 3.5 GB RSS for ~890 twoslash
      # blocks with the static hover renderer (CONTRIBUTING.md
      # "Documentation"); private-repository standard runners have 7 GB.
      - name: Build site
        run: npm run docs:build

      - name: Upload site (pull request)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: docs/.vitepress/dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload site (Pages)
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Every URL the deployed llms.txt lists must resolve on the live site.
      # Advisory until the site is public: a private Pages site sits behind
      # GitHub authentication, so the unauthenticated checker cannot reach
      # it. Pinned because this job holds the Pages deployment token.
      - name: Check llms.txt
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npx --yes llms-txt-check@0.1.5 "${PAGE_URL%/}/llms.txt"
